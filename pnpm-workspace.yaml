packages:
  - packages/*

catalog:
  "@cloudflare/vitest-plugin": 1.4.2
  "@cloudflare/workers-types": 5.20261014.1
  "@noble/curves": 2.4.0
  "@noble/hashes": 2.4.0
  fast-check: 4.10.2
  jsonc-parser: 3.3.1
  nostr-tools: 2.25.2
  typescript: 7.0.2
  valibot: 1.5.0
  vitest: 5.0.3
  wrangler: 4.151.0

# Wait three days (in minutes), matching the minimumReleaseAge of the shared Renovate preset.
minimumReleaseAge: 4320

# The platform binaries come from optionalDependencies, so the install scripts are not needed.
allowBuilds:
  esbuild: false
  lefthook: false
  workerd: false
